[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-backtest"
version = "1.0.0"
description = "A-share daily data ingestion, strategy backtesting, portfolio research, and paper-trading project"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "akshare>=1.18,<2.0",
  "matplotlib>=3.7,<4.0",
  "numpy>=1.24,<3.0",
  "pandas>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
ashare = "ashare_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
